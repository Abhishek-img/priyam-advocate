<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!-- Symbol: Abstract architectural column with balanced scale and subtle palm curve -->
  <g transform="translate(10, 8)">
    <!-- Base & Pedestal -->
    <path d="M4 40 L40 40 M8 43 L36 43" stroke="#B89A62" stroke-width="2" stroke-linecap="round"/>
    <!-- Central Pillar -->
    <path d="M22 6 L22 38" stroke="#B89A62" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M16 14 L16 38 M28 14 L28 38" stroke="#B89A62" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round"/>
    <!-- Capital Arch & Scales Beam -->
    <path d="M6 12 C14 8, 30 8, 38 12" stroke="#B89A62" stroke-width="2" stroke-linecap="round"/>
    <!-- Balanced scale cords & pans -->
    <path d="M10 13 L6 24 M14 13 L10 24" stroke="#B89A62" stroke-width="1" stroke-linecap="round"/>
    <path d="M4 24 Q10 28 16 24" stroke="#B89A62" stroke-width="1.5" fill="none"/>
    <path d="M30 13 L26 24 M34 13 L30 24" stroke="#B89A62" stroke-width="1" stroke-linecap="round"/>
    <path d="M24 24 Q30 28 36 24" stroke="#B89A62" stroke-width="1.5" fill="none"/>
    <!-- Apex Finial -->
    <circle cx="22" cy="4" r="2" fill="#B89A62"/>
  </g>
  
  <!-- Typography -->
  <text x="64" y="29" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="21" font-weight="700" letter-spacing="3.5" fill="#FFFFFF">PALM</text>
  <text x="146" y="29" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="21" font-weight="400" letter-spacing="3.5" fill="#B89A62">LEGAL</text>
  <text x="65" y="44" font-family="'Inter', 'Montserrat', sans-serif" font-size="7.5" font-weight="500" letter-spacing="3.8" fill="#94A3B8">ADVOCATES &amp; LEGAL COUNSEL</text>
  <!-- Thin divider accent -->
  <line x1="64" y1="34" x2="236" y2="34" stroke="#B89A62" stroke-width="0.75" stroke-opacity="0.3"/>
</svg>
